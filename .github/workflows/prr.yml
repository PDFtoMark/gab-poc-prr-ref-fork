name: prr-ref
on:
  pull_request_review:
    types: [submitted]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: marker
        env:
          CANARY_ENV: ${{ secrets.CANARY }}
        run: |
          echo "MARKER=FORK_HEAD_WORKFLOW"
          echo "CANARY_RAW=[${{ secrets.CANARY }}]"
          echo "CANARY_ENV=[$CANARY_ENV]"
